<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="110" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.3" />

  <!-- Outer Sound Arc rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#14b8a6" stroke-width="3" stroke-dasharray="12 18" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.15" />

  <!-- Waveform Audio Bars -->
  <g filter="url(#glow)">
    <!-- Equalizer Sound Wave Bars -->
    <rect x="116" y="216" width="20" height="80" rx="10" fill="url(#waveGrad)" />
    <rect x="156" y="166" width="20" height="180" rx="10" fill="url(#waveGrad)" />
    <rect x="196" y="126" width="20" height="260" rx="10" fill="url(#waveGrad)" />
    <rect x="236" y="96" width="24" height="320" rx="12" fill="url(#waveGrad)" />
    <rect x="280" y="146" width="20" height="220" rx="10" fill="url(#waveGrad)" />
    <rect x="320" y="186" width="20" height="140" rx="10" fill="url(#waveGrad)" />
    <rect x="360" y="226" width="20" height="60" rx="10" fill="url(#waveGrad)" />
  </g>

  <!-- Central Synth Node Pulse -->
  <circle cx="248" cy="256" r="14" fill="#ffffff" opacity="0.9" />
</svg>
